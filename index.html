<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta charset="utf-8">
<title>ALAIA — Sales Experience</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&family=Alexandria:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#100E0B; --bg2:#1A1612; --ink:#EDE4D4; --mute:rgba(237,228,212,.6); --faint:rgba(237,228,212,.07); --line:rgba(237,228,212,.16);
  --glass:rgba(18,15,12,.82); --glass2:rgba(18,15,12,.6); --acc:#B08A60; --acc-ink:#15110D;
  --avail:#4FB3A6; --resv:#D9A651; --sold:#B8674F; --blk:#8A847B;
  --shadow:0 30px 80px -30px rgba(0,0,0,.7);
  --f-d:"Archivo","Segoe UI",system-ui,sans-serif; --f-b:"Archivo","Segoe UI",system-ui,sans-serif; --f-ar:"Alexandria","Segoe UI",Tahoma,sans-serif; --f-ard:"Reem Kufi","Alexandria",Tahoma,sans-serif;
  --ease:cubic-bezier(.22,.8,.16,1);
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#ECE3D3; --bg2:#E3D8C4; --ink:#2A2018; --mute:rgba(42,32,24,.62); --faint:rgba(42,32,24,.06); --line:rgba(42,32,24,.16);
  --glass:rgba(240,233,220,.9); --glass2:rgba(240,233,220,.7); --acc:#7E5C3C; --acc-ink:#F5EFE4;
  --avail:#2E8F86; --resv:#B98532; --sold:#A0543D; --blk:#7D776F; --shadow:0 30px 80px -34px rgba(70,45,20,.45); color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-b);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .8s var(--ease),color .6s}
html[dir=rtl] body{font-family:var(--f-ar)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:1.5px solid var(--acc);outline-offset:3px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.serif{font-family:var(--f-d);font-weight:300;letter-spacing:-.01em}
html[dir=rtl] .serif{font-family:var(--f-ar);font-weight:300;letter-spacing:0}
.eye{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--acc);font-weight:500}
html[dir=rtl] .eye{letter-spacing:0;font-size:13px}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);border:1px solid var(--line);box-shadow:var(--shadow)}

/* stage */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
.frame{position:absolute;transform-origin:50% 50%;opacity:0;transition:opacity 1.1s var(--ease)}
.frame.on{opacity:1}
.frame>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.frame>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.frame.kb{animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.1) translate(-1.2%,-.8%)}}
.vign{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.45));transition:opacity .8s}
:root[data-theme=light] .vign{background:radial-gradient(120% 90% at 50% 45%,transparent 60%,rgba(60,40,20,.18))}
.scrim{position:fixed;inset:auto 0 0 0;height:42vh;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,.62),transparent);transition:opacity .8s}
:root[data-theme=light] .scrim{background:linear-gradient(to top,rgba(239,231,218,.85),transparent)}
.blurbg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) brightness(.55) saturate(1.1);transform:scale(1.1)}
:root[data-theme=light] .blurbg{filter:blur(40px) brightness(1.05) saturate(.9);opacity:.7}

/* chrome */
.top{position:fixed;top:0;inset-inline:0;display:flex;align-items:center;gap:14px;padding:22px 28px;z-index:45;pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:14px}
.brand b{font-family:var(--f-d);font-weight:400;font-size:30px;letter-spacing:.34em}
.brand span{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
html[dir=rtl] .brand span{letter-spacing:0;font-size:12px}
.crumbs{display:flex;align-items:center;gap:4px;margin-inline-start:22px;font-size:13px;color:var(--mute)}
.crumbs button{padding:8px 12px;border-radius:999px;transition:background .4s,color .3s}
.crumbs button:hover{color:var(--ink);background:var(--faint)}
.crumbs button.cur{color:var(--ink)}
.crumbs i{opacity:.35;font-style:normal}
.sp{flex:1}
body.intro .brand,body.intro .crumbs,body.intro #fs{opacity:0;pointer-events:none}.brand,.crumbs{transition:opacity .8s}
.seg{display:flex;padding:4px;border-radius:999px;gap:2px}
.seg button{padding:9px 14px;border-radius:999px;font-size:12px;color:var(--mute);white-space:nowrap;transition:background .4s var(--ease),color .3s}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}

.title{position:fixed;bottom:118px;inset-inline-start:40px;z-index:10;pointer-events:none;max-width:min(760px,60vw);transition:opacity .7s var(--ease),transform .9s var(--ease)}
.title.swap{opacity:0;transform:translateY(16px)}
.title.tt{bottom:auto;top:92px;max-width:min(400px,26vw)}.title.tt h1{font-size:clamp(30px,3vw,48px);line-height:1.02}
html[dir=rtl] .title.tt h1{font-size:clamp(24px,2.3vw,36px);line-height:1.3}.title.tt p{font-size:13.5px;max-width:34ch}
.title h1{margin:10px 0 0;font-size:clamp(46px,6.4vw,104px);line-height:.92;font-family:var(--f-d);font-weight:300;letter-spacing:-.015em;text-wrap:balance}
html[dir=rtl] .title h1{font-family:var(--f-ar);font-weight:300;font-size:clamp(36px,4.8vw,72px);line-height:1.15;letter-spacing:0}
.title p{margin:14px 0 0;color:var(--mute);font-size:15px;line-height:1.6;max-width:52ch}

.side{position:fixed;top:96px;bottom:118px;inset-inline-end:28px;width:360px;z-index:12;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;transition:opacity .6s var(--ease),transform .8s var(--ease)}
.side.off{opacity:0;transform:translateX(30px);pointer-events:none}
html[dir=rtl] .side.off{transform:translateX(-30px)}
.side .sc{overflow:auto;padding:26px;display:flex;flex-direction:column;gap:20px;scrollbar-width:thin}
.side h2{margin:6px 0 0;font-size:40px;line-height:1;font-family:var(--f-d);font-weight:300}
html[dir=rtl] .side h2{font-family:var(--f-ar);font-size:28px;line-height:1.25}
.side p{margin:0;color:var(--mute);font-size:13.5px;line-height:1.65}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat b{display:block;font-family:var(--f-d);font-size:34px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
html[dir=rtl] .stat b{font-family:var(--f-ar);font-size:24px}
.stat span{font-size:11px;color:var(--mute)}
.bar{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--faint);gap:2px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.d-available{background:var(--avail)}.d-reserved{background:var(--resv)}.d-sold{background:var(--sold)}.d-blocked{background:var(--blk)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;font-size:13px}
.kv span{color:var(--mute)}.kv b{font-weight:500;text-align:end;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--mute);transition:all .4s var(--ease)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 7px 7px 22px;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:500;font-size:14px;transition:transform .5s var(--ease)}
html[dir=rtl] .cta{padding:7px 22px 7px 7px}
.cta .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(127,127,127,.18)}
.cta:active{transform:scale(.98)}
.cta.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .cta{font-size:12.5px;padding-inline-start:16px}
.floors{display:flex;flex-direction:column;gap:2px}
.fl{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 12px;border-radius:16px;text-align:start;transition:background .35s}
.fl:hover,.fl.hl{background:var(--faint)}
.fl b{font-family:var(--f-d);font-size:30px;font-weight:300;line-height:1}
html[dir=rtl] .fl b{font-family:var(--f-ar);font-size:20px}
.fl small{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.fl .nm{display:flex;flex-direction:column;gap:7px;font-size:13px}
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--faint);font-size:12px}
.price{padding:16px 18px;border-radius:18px;background:var(--faint);display:flex;flex-direction:column;gap:4px}
.price b{font-family:var(--f-d);font-size:40px;font-weight:300;line-height:1}
html[dir=rtl] .price b{font-family:var(--f-ar);font-size:26px}
.price small{font-size:11px;color:var(--mute)}

.dock{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:2px;padding:6px;border-radius:999px}
.dock button{display:flex;align-items:center;gap:9px;padding:12px 18px;border-radius:999px;font-size:13px;color:var(--mute);white-space:nowrap;transition:all .4s var(--ease)}
.dock button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.dock button:hover{color:var(--ink)}
.dock button[aria-pressed=true]:hover{color:var(--bg)}

/* master plan overlay */
.tw{fill:rgba(255,255,255,0);stroke:rgba(255,255,255,.0);stroke-width:4;transition:fill .5s,stroke .5s;cursor:pointer}
.tw.hl,.tw:hover{fill:rgba(255,236,205,.28);stroke:rgba(255,246,230,.95)}
.tw.dim{fill:rgba(20,15,10,.35)}
.tw.av{fill:color-mix(in srgb,var(--avail) calc(var(--a)*70%),transparent)}
.lab{cursor:pointer}
.lab rect{fill:var(--glass);stroke:var(--line)}
.lab text{fill:var(--ink);font:600 22px var(--f-b);letter-spacing:.06em}
.lab text.s{font:500 17px var(--f-b);fill:var(--mute);letter-spacing:0}
.lab.hl rect{fill:var(--ink)}.lab.hl text{fill:var(--bg)}
.pin circle{fill:var(--acc);stroke:#fff;stroke-width:3}
.pin text{fill:#fff;font:600 20px var(--f-b)}
.pin{cursor:pointer;transition:opacity .5s}
.pin.off{opacity:0;pointer-events:none}
/* tower bands */
.band{fill:rgba(255,255,255,0);stroke:none;transition:fill .45s var(--ease);cursor:pointer}
.band.hl,.band:hover{fill:rgba(46,156,150,.46);stroke:rgba(255,255,255,.95);stroke-width:2.5}
.band.na{cursor:default}
.bandline{stroke:rgba(255,255,255,.35);stroke-width:1.2;stroke-dasharray:2 6;transition:opacity .5s}
.btag rect{fill:var(--glass)}.btag text{fill:var(--ink);font:500 15px var(--f-b)}
/* plan */
.plan{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.plan svg{width:100%;height:100%}
.plan .u path{fill:#FBF8F2;transition:fill .3s,opacity .3s;cursor:pointer}
.plan .u path.na{fill:#E6DFD3;cursor:default}
.plan .u path.st-available{fill:#CDE8E2}.plan .u path.st-reserved{fill:#F3E1BD}.plan .u path.st-sold{fill:#EBCBBE}.plan .u path.st-blocked{fill:#D8D3CC}
.plan .u path.dim{opacity:.35}
.plan .u path:hover:not(.na){fill:#9FD4CB}
.plan .u path.sel{fill:#E7C08E!important}
.plan .fh{fill:#E2D7C6}.plan .fl{fill:none;stroke:#8A7E70;stroke-width:1}.plan .dr{fill:none;stroke:#A39888;stroke-width:1}
.plan .w{fill:none;stroke:#2A241F;stroke-width:2.6;stroke-linecap:square}.plan .gl{fill:none;stroke:#4E8BA5;stroke-width:2.6}
.plan .ent circle{fill:#2A2119}.plan .ent text{fill:#FAF6EE;font:600 22px Manrope,sans-serif}
.planbox{position:absolute;border-radius:28px;background:#F7F2EA;box-shadow:var(--shadow);overflow:hidden}
.planbox .plan{inset:24px}
.tip{position:fixed;z-index:30;pointer-events:none;opacity:0;transition:opacity .2s;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:14px;font-size:12px;display:flex;flex-direction:column;gap:3px;white-space:nowrap}
.tip b{font-size:14px}
/* unit */
.u3d{position:absolute;display:flex;align-items:center;justify-content:center}
.u3d img{max-width:100%;max-height:100%;border-radius:24px;box-shadow:var(--shadow)}
/* walk */
.walk-cap{position:fixed;z-index:15;bottom:250px;inset-inline-start:40px;pointer-events:none;max-width:38%}
.wimg{position:absolute;display:flex;align-items:center;justify-content:center}
.wimg img{max-width:100%;max-height:100%;border-radius:22px;box-shadow:var(--shadow);animation:kbi 14s ease-out both}
@keyframes kbi{from{transform:scale(1.0)}to{transform:scale(1.045)}}
.walk-cap h3{margin:8px 0 0;font-family:var(--f-d);font-weight:300;font-size:64px;line-height:1}
html[dir=rtl] .walk-cap h3{font-family:var(--f-ar);font-size:40px}
.thumbs{position:fixed;z-index:16;bottom:130px;inset-inline-start:40px;display:flex;gap:8px}
.thumbs button{width:64px;height:80px;border-radius:12px;overflow:hidden;opacity:.5;transition:opacity .4s,transform .4s var(--ease);border:1px solid var(--line)}
.thumbs button[aria-pressed=true]{opacity:1;transform:translateY(-4px)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.arrows{position:fixed;z-index:16;top:50%;inset-inline-start:calc(44% - 80px);inset-inline-end:60px;display:flex;justify-content:space-between;pointer-events:none}
.arrows button{pointer-events:auto;width:58px;height:58px;border-radius:50%;display:grid;place-items:center}
.prog{position:fixed;z-index:16;top:0;left:0;height:2px;background:var(--acc);transition:width .2s linear}


#vfilm{position:fixed;inset:0;z-index:60;background:#000;opacity:0;transition:opacity .9s var(--ease)}#vfilm.on{opacity:1}
#vfilm video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}#vfilm video.on{opacity:1}
#vfilm .vf-sh{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.65),rgba(0,0,0,0) 40%,rgba(0,0,0,0) 80%,rgba(0,0,0,.35));pointer-events:none}
.vf-seg{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:max(28px,env(safe-area-inset-left,0px));right:max(28px,env(safe-area-inset-right,0px));display:flex;gap:6px}
.vf-seg i{flex:1;height:2px;background:rgba(255,255,255,.22);border-radius:2px;overflow:hidden}.vf-seg b{display:block;height:100%;width:0;background:#E6C397}
.vf-cap{position:absolute;left:max(40px,env(safe-area-inset-left,0px));right:40px;bottom:120px;color:#F6EFE4;opacity:0;transform:translateY(14px);transition:all 1s var(--ease)}.vf-cap.in{opacity:1;transform:none}
.vf-cap h2{margin:8px 0 0;font-family:var(--f-d);font-weight:300;font-size:clamp(26px,3.2vw,48px);line-height:1.08;text-wrap:balance;max-width:18ch;text-shadow:0 2px 30px rgba(0,0,0,.35)}.vf-cap .eye{color:#E6C397}
.vf-ctl{position:absolute;left:max(28px,env(safe-area-inset-left,0px));right:max(28px,env(safe-area-inset-right,0px));bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;color:#fff}
.vf-ctl .sp{flex:1}.vf-ctl .chip{color:#fff}.vf-ctl .chip[aria-pressed=true]{background:#F6EFE4;color:#1a1410}
.vf-seg{top:auto!important;bottom:calc(96px + env(safe-area-inset-bottom,0px))!important;height:22px;align-items:center;z-index:3}.vf-seg i{height:3px!important;cursor:pointer;transition:height .3s}.vf-seg i:hover{height:6px!important}.vf-seg b{background:var(--acc)!important}
.vf-cap{bottom:150px!important}
.vf-img{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease}.vf-img.on{opacity:1}
.vf-img.kb2{animation:kbf 7s linear forwards}@keyframes kbf{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-1.5%,-.5%)}}
.vf-tr{display:flex;align-items:center;gap:6px;padding:5px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(8,11,10,.45)}
.vf-tr button{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:background .3s}.vf-tr button:hover{background:rgba(255,255,255,.12)}
.vf-tr .pp{background:#F3EEE5;color:#0B0F0E}.vf-tr .pp:hover{background:#fff}.vf-tr .rt{width:auto;padding:0 14px;border-radius:999px;font-size:13px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.vf-note{display:none;font-size:11px;color:rgba(246,239,228,.6);max-width:46ch;line-height:1.5}
#vfilm .f-end{opacity:0;pointer-events:none;transition:opacity 1s}#vfilm.done .f-end{opacity:1;pointer-events:auto}
#gal{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;opacity:0;transition:opacity .6s var(--ease)}#gal.on{opacity:1}
.gal-in{max-width:1500px;margin:0 auto;padding:calc(36px + env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-right,0px)) 60px max(28px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.gal-h{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.gal-h h2{margin:6px 0;font-family:var(--f-d);font-weight:300;font-size:clamp(34px,4vw,58px)}.gal-h p{margin:0;max-width:60ch;color:var(--mute);line-height:1.6}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.gal-grid figure{margin:0;position:relative;border-radius:14px;overflow:hidden;cursor:pointer;aspect-ratio:16/9;background:#111}
.gal-grid img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}.gal-grid figure:hover img{transform:scale(1.04)}
.gal-grid figcaption{position:absolute;left:0;right:0;bottom:0;padding:30px 16px 12px;color:#F6EFE4;font-size:14px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
#gal .vf-note{color:var(--mute)}
#lb{position:fixed;inset:0;z-index:70;background:#000;display:none}#lb.on{display:block}.lb-soon{position:absolute;inset:0;display:grid;place-items:center;color:#EDE4D4;font-size:18px;padding:40px;text-align:center}#lb img{width:100%;height:100%;object-fit:contain}
.lb-cap{position:absolute;left:max(28px,env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));color:#F6EFE4}.lb-cap h3{margin:4px 0 0;font-family:var(--f-d);font-weight:300;font-size:28px}
.lb-p,.lb-n,.lb-x{position:absolute;color:#fff}.lb-p{left:max(20px,env(safe-area-inset-left,0px));top:50%}.lb-n{right:max(20px,env(safe-area-inset-right,0px));top:50%}.lb-x{right:max(20px,env(safe-area-inset-right,0px));top:calc(20px + env(safe-area-inset-top,0px))}

/* ==== v17 "Lagoon Night": Bodoni Moda + Jost / Amiri + IBM Plex Arabic. Panels sharp, interactive = pill. ==== */
:root{
  --bg:#0B0F0E; --bg2:#121816; --bg3:#18201D; --ink:#EEE9DF; --mute:rgba(238,233,223,.56); --faint:rgba(238,233,223,.06); --line:rgba(238,233,223,.13);
  --glass:rgba(11,15,14,.92); --glass2:rgba(11,15,14,.7); --acc:#93D3CA; --acc-ink:#07201D;
  --avail:#93D3CA; --resv:#D9B56C; --sold:#C46F58; --blk:#5E6662; --shadow:none;
  --f-d:"Onest","Segoe UI",system-ui,sans-serif; --f-b:"Onest","Segoe UI",system-ui,sans-serif;
  --f-ar:"Alexandria","Segoe UI",Tahoma,sans-serif; --f-ard:"Alexandria","Segoe UI",Tahoma,sans-serif;

}
body{font-family:var(--f-b);font-weight:400;letter-spacing:.005em}

.serif,.title h1,.side h2,.stat b,.price b,.fl b,.brand b{font-family:var(--f-d)!important;font-weight:400!important;letter-spacing:-.025em;font-variant-numeric:tabular-nums}

.glass{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;box-shadow:none!important}
/* backdrop photo */
.photobg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.0;transition:opacity 1.6s var(--ease)}
.photobg.on{opacity:1}.photobg.bl{filter:blur(34px) saturate(1.1);transform:scale(1.12)}
.photobg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 78%,transparent) 38%,color-mix(in srgb,var(--bg) 62%,transparent) 70%,var(--bg) 100%),linear-gradient(0deg,var(--bg) 0%,transparent 40%)}
.vign{display:none}
.scrim{background:linear-gradient(to top,var(--bg) 0%,transparent 100%)!important;height:30vh}
/* top bar */
.top{padding:28px 40px!important;inset-inline-end:var(--rail)!important;gap:18px}

.brand span{font-family:var(--f-b);font-size:10px;letter-spacing:.32em}
.crumbs{font-size:12px;letter-spacing:.08em}
.crumbs button{border-radius:999px}
.seg{background:transparent!important;border:1px solid var(--line)!important;border-radius:999px!important;padding:3px!important}
.seg button{border-radius:999px!important;font-size:11px!important;letter-spacing:.12em;text-transform:uppercase;padding:8px 14px!important}
html[dir=rtl] .seg button{letter-spacing:0;text-transform:none;font-size:12px!important}
.iconbtn{border-radius:50%!important;background:transparent!important;border:1px solid var(--line)!important}
/* hero title on stage */
.title{inset-inline-start:40px!important;bottom:112px!important;max-width:min(720px,52vw)}
.title.tt{top:112px!important;bottom:auto!important;max-width:min(380px,24vw)}
.title h1{font-weight:400!important;letter-spacing:-.02em!important;line-height:.95!important;font-size:clamp(48px,5.6vw,96px)!important}
.title.tt h1{font-size:clamp(36px,3.4vw,58px)!important;line-height:1!important}
html[dir=rtl] .title h1{line-height:1.25!important;font-size:clamp(40px,4.4vw,76px)!important}
html[dir=rtl] .title.tt h1{font-size:clamp(30px,2.8vw,46px)!important}
.title h1 em{font-style:italic}
.title p{font-size:15px!important;font-weight:300;line-height:1.7!important;max-width:40ch!important}
/* right rail */
.side{top:0!important;bottom:0!important;inset-inline-end:0!important;width:var(--rail)!important;border-radius:0!important;background:var(--bg2)!important;border:0!important;border-inline-start:1px solid var(--line)!important}
.side .sc{padding:112px 40px 110px!important;gap:28px!important}
.side h2{font-weight:400!important;font-size:58px!important;line-height:.95!important;letter-spacing:-.02em}
html[dir=rtl] .side h2{font-size:40px!important;line-height:1.3!important}
.side p{font-size:14px;font-weight:300;line-height:1.7}
.stats{gap:0!important;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat{padding:18px 0}
.stat+.stat{padding-inline-start:18px;border-inline-start:1px solid var(--line)}
.stat b{font-weight:400!important;font-size:clamp(30px,2.5vw,40px)!important;letter-spacing:-.02em}
.stat span{font-size:11px;letter-spacing:.14em;text-transform:uppercase}
html[dir=rtl] .stat span{letter-spacing:0;text-transform:none;font-size:12px}
.bar{height:3px!important;border-radius:0!important;gap:2px;background:transparent!important}
.legend{font-size:11px;letter-spacing:.06em}
.kv{font-size:13.5px;gap:14px 18px}
.kv b{font-weight:400}
.chips{gap:8px}

.chip[aria-pressed=true]{background:var(--ink)!important;color:var(--bg)!important;border-color:var(--ink)!important}
.chips .chip[data-b]{min-width:46px;text-align:center;padding:9px 0!important}
/* CTAs: pill, primary = lagoon */
.cta{border-radius:999px!important;padding:7px 7px 7px 26px!important;font-size:13px!important;letter-spacing:.14em;text-transform:uppercase;font-weight:500;background:var(--acc)!important;color:var(--acc-ink)!important;border:0!important;min-height:58px;justify-content:space-between}
html[dir=rtl] .cta{padding:7px 26px 7px 7px!important;letter-spacing:0;text-transform:none;font-size:15px!important}
.cta .ic{width:44px!important;height:44px!important;border-radius:50%!important;background:color-mix(in srgb,var(--acc-ink) 12%,transparent)!important;transition:transform .6s var(--ease)}
.cta:hover .ic{transform:translateX(3px) rotate(-8deg)}
.cta.ghost{background:transparent!important;color:var(--ink)!important;border:1px solid var(--line)!important}
.cta.ghost .ic{background:var(--faint)!important}
.row2{display:grid!important;grid-template-columns:1fr 1fr;gap:10px}
.row2 .cta{min-width:0;font-size:11px!important;padding-inline-start:18px!important;letter-spacing:.1em}
.status{border-radius:999px!important;background:transparent!important;border:1px solid var(--line);font-size:12px}
.price{border-radius:0!important;background:transparent!important;padding:22px 0!important;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.price b{font-weight:400!important;font-size:64px!important;letter-spacing:-.03em}
.floors{gap:0!important}
.fl{border-radius:0!important;padding:18px 4px!important;border-bottom:1px solid var(--line);grid-template-columns:64px minmax(0,1fr) auto!important}
.fl:hover,.fl.hl{background:transparent!important}.fl:hover b,.fl.hl b{color:var(--acc);font-style:italic}
.fl b{font-weight:400!important;font-size:40px!important}
/* dock: text strip */
.dock{left:40px!important;right:auto;transform:none!important;bottom:30px!important;padding:0!important;gap:28px!important;background:transparent!important;border:0!important;border-radius:0!important}
html[dir=rtl] .dock{left:auto!important;right:40px!important}
.dock button{padding:10px 0!important;border-radius:0!important;font-size:11px!important;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);background:transparent!important;border-bottom:1px solid transparent}
html[dir=rtl] .dock button{letter-spacing:0;text-transform:none;font-size:14px!important}
.dock button svg{display:none}
.dock button[aria-pressed=true]{color:var(--ink)!important;border-bottom-color:var(--acc)}
.todbar{top:auto!important;bottom:26px!important;inset-inline-end:calc(var(--rail) + 40px)!important;border-radius:999px!important;background:transparent!important;border:1px solid var(--line)!important}
/* plan overlays */
.lab rect{fill:var(--bg2)!important;stroke:var(--line)!important}
.lab text{font-family:var(--f-d)!important;font-size:30px;fill:var(--ink)!important}
.tw.hl,.tw:hover{fill:color-mix(in srgb,var(--acc) 30%,transparent)!important;stroke:var(--acc)!important}
.planbox{border-radius:18px!important;box-shadow:0 40px 90px -20px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)!important;background:#F4EEE4!important}
/* motion */
@media (prefers-reduced-motion:no-preference){
 .side .sc>*{animation:rise .9s var(--ease) both}
 .side .sc>*:nth-child(2){animation-delay:.05s}.side .sc>*:nth-child(3){animation-delay:.1s}.side .sc>*:nth-child(4){animation-delay:.15s}.side .sc>*:nth-child(5){animation-delay:.2s}.side .sc>*:nth-child(n+6){animation-delay:.25s}
 .title:not(.swap) h1{animation:rise 1.1s var(--ease) both}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.frame .amv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* interior strip under unit */
.dims{margin:18px 0 6px;display:grid;gap:0}.dims .eye{margin-bottom:8px}.dims div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line);font-size:13px}.dims div span{color:var(--mute)}.dims div b{font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em}.dims small{display:block;margin-top:8px;font-size:11px;color:var(--mute)}
.istrip{position:fixed;z-index:11;bottom:96px;inset-inline-start:40px;display:flex;gap:10px}
.istrip button{width:132px;height:84px;border-radius:0;overflow:hidden;position:relative;outline:1px solid var(--line)}
.istrip img{width:100%;height:100%;object-fit:cover;transition:transform 1s var(--ease)}
.istrip button:hover img{transform:scale(1.06)}
@media (max-width:980px){:root{--rail:100%}.side{top:auto!important;height:46vh}.top{inset-inline-end:0!important;padding:16px!important}.side .sc{padding:24px 16px 90px!important}.dock{left:16px!important;right:16px;bottom:0!important;overflow-x:auto;gap:18px!important}.title{max-width:90vw!important}.istrip{display:none}}

  const e=P.ext, len=b.L*.3*1.04, dep=b.D*.3*1.06, sx=len/(e[2]-e[0]), sz=dep/(e[3]-e[1]), side=u.p.r===0?-1:1;

const KAR='٠١٢٣٤٥٦٧٨٩';
/* ---------- Arabic-Indic digits everywhere (unit codes stay Latin: they match the inventory) */
const toAr=s=>s.replace(/(\u2066?T\d{2}(?:-[A-Z0-9]+)+\u2069?)|\d/g,(m,code)=>code?(code[0]==='\u2066'?code:'\u2066'+code+'\u2069'):KAR[m]);
function arDigits(root){ if(lang!=='ar'||!root) return; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement; if(!p||/^(SCRIPT|STYLE|TEXTAREA|INPUT|OPTION)$/.test(p.tagName)||p.closest('[data-latin]')) return NodeFilter.FILTER_REJECT; return /\d|T\d/.test(n.data)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
  const L=[]; while(w.nextNode()) L.push(w.currentNode); L.forEach(n=>{const v=toAr(n.data); if(v!==n.data) n.data=v;}); }
new MutationObserver(ms=>{ if(lang!=='ar') return; for(const m of ms){ if(m.type==='characterData') arDigits(m.target.parentElement); else m.addedNodes.forEach(n=>{ if(n.nodeType===1) arDigits(n); else if(n.nodeType===3) arDigits(n.parentElement); }); } }).observe(document.body,{subtree:true,childList:true,characterData:true});
